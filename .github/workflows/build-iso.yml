name: Build Lucent OS ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the ISO inside a Debian 13 container
        run: bash build-iso.sh docker

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: lucent-os-iso
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
